
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: macos-15

    steps:
      # actions/checkout v4.2.2
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      # Select Xcode 16.2 without an external action
      - name: Setup Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version

      - name: Install iOS 18.2 Simulator
        run: |
          mkdir -p "$HOME/SimulatorRuntimes"

          if ! xcrun simctl list runtimes | grep -q 'iOS 18.2'; then
            xcodebuild -downloadPlatform iOS \
              -buildVersion 18.2 \
              -exportPath "$HOME/SimulatorRuntimes"

            xcodebuild -importPlatform \
              "$HOME/SimulatorRuntimes/iphonesimulator_18.2_22C150.dmg"
          fi

      - name: Deploy new version
        run: swift run
        working-directory: ./deploy_new_version
        env:
          APPLE_APP_STORE_CONNECT_KEY: ${{ secrets.APPLE_APP_STORE_CONNECT_KEY }}
          APPLE_APP_STORE_CONNECT_KEY_ID: ${{ secrets.APPLE_APP_STORE_CONNECT_KEY_ID }}
          APPLE_APP_STORE_CONNECT_KEY_ISSUER_ID: ${{ secrets.APPLE_APP_STORE_CONNECT_KEY_ISSUER_ID }}
          XCODE_PROVISIONING_PROFILE: ${{ secrets.XCODE_PROVISIONING_PROFILE }}
          XCODE_SIGNING_CERT: ${{ secrets.XCODE_SIGNING_CERT }}
          XCODE_SIGNING_CERT_PASSWORD: ${{ secrets.XCODE_SIGNING_CERT_PASSWORD }}

